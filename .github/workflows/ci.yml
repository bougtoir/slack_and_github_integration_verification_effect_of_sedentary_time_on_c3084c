name: smoke
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m compileall paper_sandbox
      - run: PYTHONPATH=. python tests/test_basic.py
      - run: PYTHONPATH=. python tests/test_data_pipeline.py
      - run: PYTHONPATH=. python tests/test_figure_digitize.py
      - run: PYTHONPATH=. python tests/test_literature.py
